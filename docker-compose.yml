services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      server:
        condition: service_healthy
